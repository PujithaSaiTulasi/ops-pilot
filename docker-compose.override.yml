# Development overrides — automatically merged by `docker compose up`.
# Adds hot-reload for the API; not used in any production-like context.
services:
  api:
    environment:
      PYTHONPATH: /app/src
    command:
      - uvicorn
      - opspilot.api.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
    volumes:
      - ./src:/app/src:ro
