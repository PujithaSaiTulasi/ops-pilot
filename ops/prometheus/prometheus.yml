# Prometheus scrape configuration for the local OpsPilot stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: opspilot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: opspilot
  - job_name: simulated-services
    metrics_path: /metrics
    static_configs:
      - targets: ["checkout:8000", "payment:8000", "inventory:8000"]
        labels:
          environment: simulated
