name: OpsPilot CI

on:
  push:
    branches: [main, feature/opspilot-build]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: make test
      - name: Lint and type check
        run: make lint
      - name: Evaluation regression suite
        run: make eval
      - name: Compose validation
        run: docker compose config --quiet
