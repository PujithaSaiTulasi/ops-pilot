name: OpsPilot CI

on:
  push:
    branches: [main, feature/opspilot-build]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make install PYTHON=python
      - name: Test
        run: make test
      - name: Lint and type check
        run: make lint
      - name: Evaluation regression suite
        run: make eval
      - name: Compose validation
        run: docker compose config --quiet
      - name: Container assets and offline demo
        run: |
          docker build -t opspilot-ci .
          docker run --rm -e MOCK_LLM=true -e REDIS_URL= -e OTEL_TRACES_EXPORTER=none opspilot-ci python -m opspilot.cli demo
          docker run --rm opspilot-ci python -m opspilot.evals
